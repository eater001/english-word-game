<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趣味英语 · 消消乐 + 记忆闯关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(160deg, #6ec6ff 0%, #ffd3e0 50%, #c8e6c9 100%);
            padding: 16px;
            overflow-x: hidden;
        }

        .bg-float {
            position: fixed;
            font-size: 2.5rem;
            opacity: 0.25;
            pointer-events: none;
            animation: floatUp 12s linear infinite;
            z-index: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-20vh) rotate(360deg); }
        }

        .game-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 720px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            border-radius: 50px 50px 40px 40px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2), inset 0 3px 8px rgba(255, 255, 255, 0.8);
            padding: 18px 18px 24px;
            border: 4px solid #fff;
        }

        .hidden { display: none !important; }
        .screen { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .main-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .main-title h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1f4e6f, #2b6c8f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .main-title .title-emoji {
            font-size: 1.8rem;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.15));
        }

        .mode-switch {
            display: flex;
            background: #e0d5c0;
            border-radius: 40px;
            padding: 4px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
            gap: 4px;
        }

        .mode-btn {
            border: none;
            background: transparent;
            border-radius: 40px;
            padding: 8px 16px;
            font-weight: 800;
            font-size: 0.9rem;
            color: #7a6a4a;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .mode-btn.active {
            background: white;
            color: #1f4e6f;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }

        .home-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 16px 0;
        }

        .home-stat {
            background: white;
            border-radius: 20px;
            padding: 14px 8px;
            text-align: center;
            box-shadow: 0 6px 0 #c9b89a, 0 8px 14px rgba(0,0,0,0.15);
        }

        .home-stat .stat-num {
            font-size: 1.7rem;
            font-weight: 800;
            color: #1f4e6f;
            line-height: 1;
        }

        .home-stat .stat-label {
            font-size: 0.75rem;
            color: #8a7a5a;
            font-weight: 700;
            margin-top: 6px;
        }

        .progress-bar-wrapper {
            background: #e0d5c0;
            border-radius: 40px;
            padding: 6px;
            margin: 14px 0;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.1);
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #7bbd8f, #4caf50);
            border-radius: 40px;
            height: 22px;
            transition: width 0.5s;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            font-size: 0.75rem;
            font-weight: 800;
            color: white;
            min-width: 50px;
            box-shadow: 0 2px 0 #2e7d32;
        }

        .big-btn {
            background: #ffb347;
            border: none;
            border-radius: 60px;
            padding: 16px 30px;
            font-weight: 800;
            font-size: 1.2rem;
            color: #2d3e2f;
            box-shadow: 0 10px 0 #b16f2c, 0 12px 22px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            transition: all 0.08s linear;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transform: translateY(0);
            width: 100%;
            margin-top: 12px;
        }

        .big-btn:active {
            transform: translateY(6px);
            box-shadow: 0 3px 0 #b16f2c, 0 8px 12px rgba(0, 0, 0, 0.2);
        }

        .big-btn.green {
            background: #7bbd8f;
            color: #1e3c2a;
            box-shadow: 0 10px 0 #4c7a5e, 0 12px 22px rgba(0,0,0,0.25);
        }

        .big-btn.green:active {
            box-shadow: 0 3px 0 #4c7a5e, 0 8px 12px rgba(0,0,0,0.2);
        }

        .big-btn.secondary {
            background: #e6d8c0;
            color: #3e3e2e;
            box-shadow: 0 10px 0 #ab8e6a, 0 12px 22px rgba(0,0,0,0.25);
            font-size: 1rem;
            padding: 13px 24px;
        }

        .big-btn.secondary:active {
            box-shadow: 0 3px 0 #ab8e6a, 0 8px 12px rgba(0,0,0,0.2);
        }

        .button-row {
            display: flex;
            gap: 10px;
        }

        .level-picker {
            background: white;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 6px 0 #c9b89a;
            margin: 12px 0;
        }

        .level-picker-label {
            font-size: 0.85rem;
            color: #8a7a5a;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .level-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .level-input {
            flex: 1;
            border: 3px solid #e0d0b0;
            border-radius: 16px;
            padding: 10px 14px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #1f4e6f;
            text-align: center;
            outline: none;
            background: #fffdf5;
            transition: all 0.15s;
        }

        .level-input:focus {
            border-color: #ffd966;
            box-shadow: 0 0 0 3px rgba(255,217,102,0.3);
        }

        .level-go-btn {
            background: #7bbd8f;
            border: none;
            border-radius: 16px;
            padding: 10px 20px;
            font-weight: 800;
            font-size: 0.95rem;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 0 #4c7a5e;
            transition: all 0.1s;
            transform: translateY(0);
            white-space: nowrap;
        }

        .level-go-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #4c7a5e;
        }

        .learning-hint {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            border-radius: 16px;
            padding: 10px 16px;
            margin: 10px 0;
            font-size: 0.85rem;
            color: #1565c0;
            font-weight: 700;
            text-align: center;
            border-left: 5px solid #2196f3;
        }

        .level-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #fff9c4, #ffe082);
            border-radius: 60px;
            padding: 10px 18px;
            margin-bottom: 12px;
            box-shadow: 0 6px 0 #e6a817;
            border: 3px solid #ffb300;
            gap: 10px;
            flex-wrap: wrap;
        }

        .level-badge {
            background: #ff7043;
            border-radius: 40px;
            padding: 6px 16px;
            font-weight: 800;
            color: #fff;
            font-size: 1.1rem;
            box-shadow: inset 0 -3px 0 #bf360c;
            text-shadow: 1px 1px 0 #bf360c;
        }

        .stars-display {
            display: flex;
            gap: 4px;
            font-size: 1.4rem;
        }

        .star.earned { animation: pop 0.4s ease; }

        @keyframes pop {
            0% { transform: scale(0.5) rotate(-20deg); }
            70% { transform: scale(1.3) rotate(10deg); }
            100% { transform: scale(1) rotate(0); }
        }

        .stats {
            display: flex;
            gap: 10px;
            font-weight: bold;
            color: #5d4037;
            font-size: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .stats span {
            background: #fff;
            padding: 5px 12px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 3px 0 #d7ccc8;
            border: 2px solid #ffb300;
            font-weight: 700;
        }

        .timer-box {
            background: #ffecd2;
            border-radius: 40px;
            padding: 5px 14px;
            font-weight: 800;
            color: #b34a1a;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: inset 0 -3px 0 #d4a373;
        }

        .timer-box.warning {
            background: #ffb3b3;
            color: #8b0000;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .sound-toggle {
            background: #e6d8c0;
            border: none;
            border-radius: 40px;
            padding: 6px 14px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #2e4a3a;
            cursor: pointer;
            box-shadow: 0 4px 0 #ab8e6a;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            gap: 5px;
            transform: translateY(0);
        }

        .sound-toggle:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #ab8e6a;
        }

        .sound-toggle.muted {
            background: #d4c4b0;
            color: #8a7a6a;
        }

        .board-candy {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 12px 0 8px;
        }

        .card-candy {
            aspect-ratio: 1 / 1;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            transition: 0.08s linear;
            position: relative;
            overflow: hidden;
            transform: translateY(-2px);
            text-transform: uppercase;
            padding: 4px;
        }

        .card-candy[data-type="letter"] {
            background: linear-gradient(145deg, #fff8e1, #ffe0b2);
            color: #e65100;
            font-size: 3rem;
            border: 4px solid #ffb300;
            box-shadow: 0 8px 0 #e6a817, 0 10px 15px rgba(0, 0, 0, 0.15),
                        inset 0 -4px 0 #ffcc80, inset 0 4px 0 #fff8e1;
            text-shadow: 2px 2px 0 #ffcc80;
            letter-spacing: -1px;
            font-weight: 900;
        }

        .card-candy[data-type="word"] {
            background: linear-gradient(145deg, #e3f2fd, #bbdefb);
            color: #1565c0;
            border: 4px solid #64b5f6;
            box-shadow: 0 8px 0 #42a5f5, 0 10px 15px rgba(0, 0, 0, 0.15),
                        inset 0 -4px 0 #90caf9, inset 0 4px 0 #e3f2fd;
            padding: 6px 4px;
            justify-content: center;
            gap: 2px;
        }

        .card-candy[data-type="image"] {
            background: linear-gradient(145deg, #f3e5f5, #e1bee7);
            border: 4px solid #ba68c8;
            box-shadow: 0 8px 0 #8e24aa, 0 10px 15px rgba(0, 0, 0, 0.15),
                        inset 0 -4px 0 #ce93d8, inset 0 4px 0 #f3e5f5;
            font-size: 3rem;
        }

        .card-candy.decoy {
            background: linear-gradient(145deg, #f0e0f8, #e1bee7);
            border: 4px dashed #b39ddb;
            box-shadow: 0 8px 0 #9575cd, 0 10px 15px rgba(0, 0, 0, 0.15);
        }

        .card-candy .word-text {
            font-size: 1.3rem;
            font-weight: 800;
            color: #0d47a1;
            text-shadow: 1px 1px 0 #bbdefb;
            line-height: 1.1;
            word-break: break-all;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .card-candy[data-type="word"]::after {
            content: "🔊";
            position: absolute;
            bottom: 4px;
            right: 6px;
            font-size: 0.75rem;
            opacity: 0.7;
        }

        .card-candy.selected {
            box-shadow: 0 0 0 6px #ffd54f, 0 8px 0 #bcaaa4 !important;
            transform: scale(1.05) translateY(-2px) !important;
            filter: brightness(1.05);
            z-index: 3;
        }

        .card-candy.eliminated {
            background: #a5d6a7;
            box-shadow: 0 4px 0 #4caf50;
            transform: translateY(4px) scale(0.98);
            border-color: #66bb6a;
            cursor: default;
            opacity: 0.85;
            pointer-events: none;
        }

        .card-candy.eliminated .word-text {
            display: none;
        }

        .card-candy.eliminated::after {
            content: "🌟" !important;
            font-size: 2rem !important;
            animation: pop 0.4s ease;
            position: static !important;
            opacity: 1 !important;
            right: auto !important;
            bottom: auto !important;
        }

        .board-memory {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 12px 0 8px;
        }

        .card-memory {
            aspect-ratio: 1 / 1;
            background: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            box-shadow: 0 8px 0 #9b7e5e, 0 10px 14px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            transition: all 0.1s ease;
            border: 2px solid #f3e1c2;
            padding: 6px;
            position: relative;
            transform: translateY(0);
        }

        .card-memory:active:not(.matched) {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #9b7e5e, 0 6px 8px rgba(0, 0, 0, 0.2);
        }

        .card-memory.matched {
            box-shadow: 0 4px 0 #4c7a5e, 0 6px 10px rgba(0, 0, 0, 0.15);
            transform: translateY(4px);
            background: #e2f0e6;
            border: 2px solid #7bbd8f;
            cursor: default;
            opacity: 0.85;
            pointer-events: none;
        }

        .card-memory.selected {
            box-shadow: 0 0 0 5px #ffd966, 0 8px 0 #9b7e5e, 0 10px 14px rgba(0, 0, 0, 0.25);
            border: 2px solid #ffb347;
            transform: scale(1.02);
        }

        .card-memory.decoy {
            background: #f0e0f8;
            border: 2px dashed #b39ddb;
        }

        .card-memory .word-text {
            font-size: 1.2rem;
            font-weight: 800;
            color: #1f3b4a;
            text-align: center;
            line-height: 1.2;
            word-break: break-word;
        }

        .card-memory .emoji {
            font-size: 2.5rem;
            line-height: 1;
            filter: drop-shadow(2px 6px 8px rgba(0, 0, 0, 0.2));
        }

        .speaker-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #ffd966;
            border: none;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 0 #c9a53a;
            transition: all 0.1s;
            padding: 0;
            z-index: 5;
        }

        .speaker-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #c9a53a;
        }

        .message-area {
            min-height: 58px;
            text-align: center;
            font-size: 1.05rem;
            font-weight: bold;
            color: #5d4037;
            padding: 12px;
            background: linear-gradient(135deg, #fff8e1, #ffecb3);
            border-radius: 40px;
            margin: 10px 0;
            border: 3px dashed #ffb300;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #ffe082;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .ctrl-btn {
            background: linear-gradient(135deg, #ffb74d, #ff9800);
            border: none;
            border-radius: 40px;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 6px 0 #e65100, 0 5px 10px rgba(0,0,0,0.2);
            transition: 0.06s linear;
            flex: 1;
            border: 2px solid #fff;
            text-shadow: 1px 1px 0 #e65100;
            min-width: 110px;
        }

        .ctrl-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #e65100;
        }

        .ctrl-btn:disabled {
            opacity: 0.45;
            transform: translateY(3px);
            box-shadow: 0 3px 0 #bf360c;
            pointer-events: none;
            filter: grayscale(0.5);
        }

        .ctrl-btn.green {
            background: linear-gradient(135deg, #81c784, #4caf50);
            box-shadow: 0 6px 0 #2e7d32;
            text-shadow: 1px 1px 0 #2e7d32;
        }

        .ctrl-btn.green:active {
            box-shadow: 0 1px 0 #2e7d32;
        }

        .ctrl-btn.gray {
            background: linear-gradient(135deg, #bcaaa4, #8d6e63);
            box-shadow: 0 6px 0 #4e342e;
            text-shadow: 1px 1px 0 #4e342e;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal {
            background: #fef9e8;
            border-radius: 40px;
            padding: 30px 36px;
            text-align: center;
            box-shadow: 0 30px 50px rgba(0,0,0,0.5), inset 0 0 0 3px #ffd966;
            animation: bounceIn 0.5s;
            max-width: 90vw;
            width: 100%;
            max-width: 440px;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.6); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal h2 {
            font-size: 1.7rem;
            color: #1f4e6f;
            margin-bottom: 12px;
        }

        .modal .big-stars {
            font-size: 2.8rem;
            margin: 14px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .modal .big-star {
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
            animation: starPop 0.5s backwards;
        }

        .modal .big-star:nth-child(1) { animation-delay: 0.1s; }
        .modal .big-star:nth-child(2) { animation-delay: 0.3s; }
        .modal .big-star:nth-child(3) { animation-delay: 0.5s; }

        @keyframes starPop {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            80% { transform: scale(1.3) rotate(10deg); }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        .modal .encourage-text {
            font-size: 1.15rem;
            color: #4a5e4a;
            margin-bottom: 20px;
            font-weight: 700;
            line-height: 1.5;
        }

        .modal .encourage-sub {
            font-size: 0.9rem;
            color: #8a7a5a;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .modal-btn {
            border: none;
            border-radius: 50px;
            padding: 12px 22px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.1s;
            transform: translateY(0);
        }

        .modal-btn.primary {
            background: #7bbd8f;
            color: #1e3c2a;
            box-shadow: 0 8px 0 #4c7a5e, 0 10px 16px rgba(0,0,0,0.25);
        }

        .modal-btn.primary:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #4c7a5e;
        }

        .modal-btn.secondary {
            background: #e6d8c0;
            color: #3e3e2e;
            box-shadow: 0 8px 0 #ab8e6a, 0 10px 16px rgba(0,0,0,0.25);
        }

        .modal-btn.secondary:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #ab8e6a;
        }

        .star-fall {
            position: fixed;
            font-size: 1.8rem;
            pointer-events: none;
            z-index: 999;
            animation: starFall 1.2s ease-out forwards;
        }

        @keyframes starFall {
            0% { transform: translateY(0) rotate(0deg) scale(0); opacity: 1; }
            30% { transform: translateY(-30px) rotate(60deg) scale(1.2); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg) scale(0.8); opacity: 0; }
        }

        .animal-bubble {
            position: fixed;
            background: #fff;
            border-radius: 50%;
            padding: 12px 14px;
            font-size: 1.8rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.25);
            border: 3px solid #ffb300;
            z-index: 1000;
            animation: bubblePop 0.8s ease-out forwards;
            pointer-events: none;
        }

        @keyframes bubblePop {
            0% { transform: scale(0) rotate(-20deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            pointer-events: none;
            z-index: 998;
            animation: confettiFall 1.5s ease-out forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        @media (max-width: 650px) {
            .game-wrapper { padding: 14px; }
            .main-title h1 { font-size: 1.3rem; }
            .mode-btn { padding: 6px 10px; font-size: 0.8rem; }

            .level-badge { font-size: 0.95rem; padding: 5px 12px; }
            .stats { font-size: 0.85rem; }
            .stats span { padding: 4px 8px; }
            .message-area { font-size: 0.95rem; }
        }

        @media (max-width: 450px) {
            .board-candy { grid-template-columns: repeat(3, 1fr); gap: 7px; }
            .board-memory { grid-template-columns: repeat(3, 1fr); gap: 7px; }
            .controls { flex-direction: column; }
            .ctrl-btn { width: 100%; }
            .mode-switch { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    </div>

    <script>
        (function() {
            // ============================================================
            // 音效引擎
            // ============================================================
            let audioCtx = null;
            function initAudio() {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }
            function playTone(freq, duration = 0.1, type = 'sine', volume = 0.2) {
                try {
                    initAudio();
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gainNode.gain.value = volume;
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    osc.start();
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    osc.stop(audioCtx.currentTime + duration);
                } catch (e) {}
            }
            function playSelectSound() { playTone(880, 0.08, 'sine', 0.15); }
            function playMatchSound() {
                playTone(660, 0.1, 'triangle', 0.2);
                setTimeout(() => playTone(880, 0.12, 'triangle', 0.2), 80);
                setTimeout(() => playTone(1100, 0.15, 'triangle', 0.2), 160);
            }
            function playErrorSound() {
                playTone(300, 0.2, 'sawtooth', 0.1);
                setTimeout(() => playTone(220, 0.25, 'sawtooth', 0.1), 100);
            }
            function playLevelCompleteSound() {
                playTone(523, 0.15, 'sine', 0.2);
                setTimeout(() => playTone(659, 0.15, 'sine', 0.2), 120);
                setTimeout(() => playTone(784, 0.15, 'sine', 0.25), 240);
                setTimeout(() => playTone(1046, 0.3, 'sine', 0.25), 380);
            }

            // ============================================================
            // 语音引擎（童声 + 微软语音优先 + 快速响应）
            // ============================================================
            let speechSynth = window.speechSynthesis || null;
            let voices = [];
            let americanVoice = null;
            let chineseVoice = null;
            let soundEnabled = true;
            let voiceReady = false;

            function loadVoices() {
                if (!speechSynth) return;
                voices = speechSynth.getVoices();

                // 优先级列表（越靠前越优先）
                // 微软语音放最前面（华为平板上音质最好）
                const voicePriority = [
                    'Microsoft Aria Online',
                    'Microsoft Jenny Online',
                    'Microsoft Guy Online',
                    'Microsoft Zira',
                    'Microsoft Aria',
                    'Microsoft Jenny',
                    'Microsoft Guy',
                    'Microsoft',
                    'Google US English',
                    'Samantha',
                    'Karen',
                    'Moira',
                    'Female',
                    'Natural'
                ];

                // 从高优先级开始找
                americanVoice = null;
                for (const keyword of voicePriority) {
                    const found = voices.find(v =>
                        v.lang.startsWith('en') && v.name.includes(keyword)
                    );
                    if (found) {
                        americanVoice = found;
                        break;
                    }
                }

                // 没找到就用任意 en-US
                if (!americanVoice) {
                    americanVoice = voices.find(v => v.lang === 'en-US');
                }
                if (!americanVoice) {
                    americanVoice = voices.find(v => v.lang.startsWith('en'));
                }
                if (!americanVoice) {
                    americanVoice = voices[0] || null;
                }

                // 中文也优先微软
                chineseVoice = voices.find(v =>
                    v.lang.startsWith('zh') && v.name.includes('Microsoft')
                ) || voices.find(v => v.lang === 'zh-CN') ||
                  voices.find(v => v.lang.startsWith('zh')) || null;

                voiceReady = voices.length > 0;

                console.log('🎤 语音列表已加载：', voices.length, '个');
                console.log('🎯 选中的英语语音：', americanVoice ? americanVoice.name : '未找到');
                console.log('🎯 选中的中文语音：', chineseVoice ? chineseVoice.name : '未找到');

                const enVoices = voices.filter(v => v.lang.startsWith('en'));
                if (enVoices.length > 0) {
                    console.log('📋 所有可用英语语音：');
                    enVoices.forEach(v => console.log('  -', v.name, '(' + v.lang + ')'));
                }
            }

            // 页面加载时立即初始化
            if (speechSynth) {
                loadVoices();
                speechSynth.onvoiceschanged = loadVoices;
                setTimeout(loadVoices, 100);
                setTimeout(loadVoices, 500);
                setTimeout(loadVoices, 1500);
            }

            // 童声朗读单词
            function speakWord(word, rate = 1.0) {
                if (!soundEnabled || !speechSynth) return false;
                try {
                    if (speechSynth.speaking || speechSynth.pending) {
                        speechSynth.cancel();
                    }
                    const u = new SpeechSynthesisUtterance(word);
                    u.lang = 'en-US';
                    u.rate = rate;
                    u.pitch = 1.6;         // 童声高音调
                    u.volume = 1.0;
                    if (americanVoice) u.voice = americanVoice;
                    speechSynth.speak(u);
                    return true;
                } catch (e) { return false; }
            }

            // 童声朗读字母
            function speakLetter(letter) {
                if (!soundEnabled || !speechSynth) return false;
                try {
                    if (speechSynth.speaking || speechSynth.pending) {
                        speechSynth.cancel();
                    }
                    const u = new SpeechSynthesisUtterance(letter);
                    u.lang = 'en-US';
                    u.rate = 1.0;
                    u.pitch = 1.7;
                    u.volume = 1.0;
                    if (americanVoice) u.voice = americanVoice;
                    speechSynth.speak(u);
                    return true;
                } catch (e) { return false; }
            }

            // ============================================================
            // 语音鼓励语库
            // ============================================================
            const VOICE_ENCOURAGE = {
                3: [
                    { en: 'Excellent! You are amazing!', zh: '太棒了！你真了不起！' },
                    { en: 'Perfect! You did it!', zh: '完美！你做到了！' },
                    { en: 'Wonderful! You are a superstar!', zh: '精彩！你是超级明星！' },
                    { en: 'Fantastic! You are so smart!', zh: '太棒了！你真聪明！' },
                    { en: 'Amazing! Keep it up!', zh: '惊人！继续保持！' }
                ],
                2: [
                    { en: 'Great job! Almost perfect!', zh: '做得好！几乎完美！' },
                    { en: 'Well done! You are getting better!', zh: '干得好！你越来越棒了！' },
                    { en: 'Good work! Keep trying!', zh: '做得好！继续努力！' },
                    { en: 'Nice! You can do even better!', zh: '不错！你可以做得更好！' },
                    { en: 'Very good! Try again for a perfect score!', zh: '非常好！再试一次争取满分！' }
                ],
                1: [
                    { en: 'Good try! Practice makes perfect!', zh: '很好的尝试！熟能生巧！' },
                    { en: 'You did it! Keep going!', zh: '你做到了！继续加油！' },
                    { en: 'Nice effort! You will improve!', zh: '很努力！你会进步的！' },
                    { en: 'Well done! Try again for a better score!', zh: '做得好！再试一次拿更高分！' },
                    { en: 'Great start! Practice more!', zh: '好的开始！多练习！' }
                ]
            };

            // 童声鼓励语
            function speakEncouragement(starCount) {
                if (!soundEnabled || !speechSynth) return;
                playLevelCompleteSound();
                const pool = VOICE_ENCOURAGE[starCount] || VOICE_ENCOURAGE[2];
                const chosen = pool[Math.floor(Math.random() * pool.length)];
                setTimeout(() => {
                    speechSynth.cancel();
                    const enUtter = new SpeechSynthesisUtterance(chosen.en);
                    enUtter.lang = 'en-US';
                    enUtter.rate = 1.0;
                    enUtter.pitch = 1.55;
                    enUtter.volume = 1.0;
                    if (americanVoice) enUtter.voice = americanVoice;
                    enUtter.onend = () => {
                        setTimeout(() => {
                            const zhUtter = new SpeechSynthesisUtterance(chosen.zh);
                            zhUtter.lang = 'zh-CN';
                            zhUtter.rate = 1.0;
                            zhUtter.pitch = 1.35;
                            zhUtter.volume = 1.0;
                            if (chineseVoice) zhUtter.voice = chineseVoice;
                            speechSynth.speak(zhUtter);
                        }, 150);
                    };
                    speechSynth.speak(enUtter);
                }, 400);
            }

            // ============================================================
            // 特效
            // ============================================================
            function createStars(x, y, count = 5) {
                for (let i = 0; i < count; i++) {
                    const star = document.createElement('div');
                    star.className = 'star-fall';
                    star.textContent = ['⭐', '🌟', '✨', '💫'][Math.floor(Math.random() * 4)];
                    star.style.left = (x + (Math.random() - 0.5) * 100) + 'px';
                    star.style.top = y + 'px';
                    star.style.fontSize = (1.2 + Math.random() * 1) + 'rem';
                    star.style.animationDelay = (i * 0.1) + 's';
                    document.body.appendChild(star);
                    setTimeout(() => star.remove(), 1500);
                }
            }
            function createConfetti(count = 20) {
                const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#f368e0', '#ff9f43'];
                for (let i = 0; i < count; i++) {
                    const conf = document.createElement('div');
                    conf.className = 'confetti';
                    conf.style.left = Math.random() * 100 + 'vw';
                    conf.style.top = '-10px';
                    conf.style.background = colors[Math.floor(Math.random() * colors.length)];
                    conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    conf.style.width = (8 + Math.random() * 8) + 'px';
                    conf.style.height = (8 + Math.random() * 8) + 'px';
                    conf.style.animationDelay = (Math.random() * 0.5) + 's';
                    conf.style.animationDuration = (1 + Math.random()) + 's';
                    document.body.appendChild(conf);
                    setTimeout(() => conf.remove(), 2500);
                }
            }
            function showAnimalBubble(x, y, animalType = 'dog') {
                const animals = { dog: '🐶', cat: '🐱', bird: '🐦', duck: '🦆',
                                  bear: '🐻', rabbit: '🐰', panda: '🐼', lion: '🦁' };
                const bubble = document.createElement('div');
                bubble.className = 'animal-bubble';
                bubble.textContent = animals[animalType] || '🐶';
                bubble.style.left = (x - 25) + 'px';
                bubble.style.top = (y - 50) + 'px';
                document.body.appendChild(bubble);
                setTimeout(() => bubble.remove(), 900);
            }
            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            // ============================================================
            // 模式切换
            // ============================================================
            const modeCandy = document.getElementById('modeCandy');
            const modeMemory = document.getElementById('modeMemory');
            const mainEmoji = document.getElementById('mainEmoji');
            const mainTitle = document.getElementById('mainTitle');

            function switchMode(mode) {
                modeCandy.classList.toggle('active', mode === 'candy');
                modeMemory.classList.toggle('active', mode === 'memory');
                mainEmoji.textContent = mode === 'candy' ? '🧩' : '🧠';
                mainTitle.textContent = mode === 'candy' ? '字母消消乐' : '记忆闯关';
                hideAllScreens();
                if (mode === 'candy') {
                    candyRenderHome();
                    document.getElementById('candy-home').classList.remove('hidden');
                } else {
                    memoryRenderHome();
                    document.getElementById('memory-home').classList.remove('hidden');
                }
            }
            function hideAllScreens() {
                ['candy-home', 'candy-game', 'memory-home', 'memory-game'].forEach(id => {
                    document.getElementById(id).classList.add('hidden');
                });
            }
            modeCandy.addEventListener('click', () => switchMode('candy'));
            modeMemory.addEventListener('click', () => switchMode('memory'));

            // 鼓励语文本库（弹窗用）
            const ENCOURAGE_3STAR = [
                '🏆 完美通关！你就是英语小天才！',
                '🌟 太厉害了！全对！继续保持！',
                '🎉 满分！你的记忆力超棒！',
                '✨ 完美！这些单词你全记住了！',
                '👑 你是单词小王子/小公主！'
            ];
            const ENCOURAGE_2STAR = [
                '😊 很不错！再细心一点就满分啦！',
                '💪 做得很好！下次挑战零失误！',
                '🌟 很棒！你已经掌握大部分啦！',
                '🎯 差一点点就完美！继续加油！',
                '👍 表现不错！再来一次会更好！'
            ];
            const ENCOURAGE_1STAR = [
                '🎈 完成啦！多练习就会越来越棒！',
                '🌱 不错哦！每一次都是进步！',
                '💡 加油！你已经迈出重要一步！',
                '🤗 完成通关！下次试试更快？',
                '🌈 做得好！继续努力会有惊喜！'
            ];
            function getEncourageText(starCount) {
                const pool = starCount >= 3 ? ENCOURAGE_3STAR :
                             starCount === 2 ? ENCOURAGE_2STAR : ENCOURAGE_1STAR;
                return pool[Math.floor(Math.random() * pool.length)];
            }

            // ============================================================
            // 共用词库
            // ============================================================
            const WORD_BANK = [
                { word: 'cat', emoji: '🐱' }, { word: 'dog', emoji: '🐶' },

            // ============================================================
            // 消消乐模式（1000 关）
            // ============================================================
            const CANDY_TOTAL_LEVELS = 1000;

            function candyGetLevelConfig(level) {
                let pairCount;
                if (level <= 100) pairCount = 6;
                else if (level <= 300) pairCount = 7;
                else if (level <= 600) pairCount = 8;
                else if (level <= 900) pairCount = 9;
                else pairCount = 10;

                let newWordCount, reviewWordCount;
                if (level <= 100) { newWordCount = 4; reviewWordCount = pairCount - newWordCount; }
                else if (level <= 300) { newWordCount = 4; reviewWordCount = pairCount - newWordCount; }
                else if (level <= 600) { newWordCount = 3; reviewWordCount = pairCount - newWordCount; }
                else { newWordCount = 3; reviewWordCount = pairCount - newWordCount; }
                if (reviewWordCount < 0) reviewWordCount = 0;

                let timeLimit = null;
                if (level > 400) timeLimit = Math.max(40, 100 - Math.floor((level - 400) / 25));
                if (level > 800) timeLimit = Math.max(35, 80 - Math.floor((level - 800) / 30));

                let decoys = 0;
                if (level > 600) decoys = 1;
                if (level > 850) decoys = 2;

                let phase;
                if (level <= 100) phase = '入门';
                else if (level <= 300) phase = '基础';
                else if (level <= 600) phase = '进阶';
                else if (level <= 850) phase = '强化';
                else phase = '大师';

                return { pairCount, newWordCount, reviewWordCount, timeLimit, decoys, phase };
            }

            let candyProgress = candyLoadProgress();
            function candyLoadProgress() {
                try {
                    const saved = localStorage.getItem('candyProgressV3');
                    if (saved) {
                        const d = JSON.parse(saved);
                        return {
                            currentLevel: d.currentLevel || 1,
                            levelStars: d.levelStars || {},
                            wordStats: d.wordStats || {}
                        };
                    }
                } catch (e) {}
                return { currentLevel: 1, levelStars: {}, wordStats: {} };
            }
            function candySaveProgress() {
                try { localStorage.setItem('candyProgressV3', JSON.stringify(candyProgress)); } catch (e) {}
            }

            function candySelectWordsForLevel(level) {
                const config = candyGetLevelConfig(level);
                const selected = [];
                const reviewCandidates = [];
                Object.keys(candyProgress.wordStats).forEach(word => {
                    const stat = candyProgress.wordStats[word];
                    if (!stat.mastered && stat.nextReview <= level) {
                        reviewCandidates.push({ word, ...stat });
                    }
                });
                reviewCandidates.sort((a, b) => a.nextReview - b.nextReview);
                for (let i = 0; i < config.reviewWordCount && i < reviewCandidates.length; i++) {
                    const r = reviewCandidates[i];
                    const wd = WORD_BANK.find(w => w.word === r.word);
                    if (wd) selected.push(wd);
                }
                const unseen = WORD_BANK.filter(w => !candyProgress.wordStats[w.word]);
                for (let i = 0; i < config.newWordCount && i < unseen.length; i++) {
                    selected.push(unseen[i]);
                }
                if (selected.length < config.pairCount) {
                    const mastered = Object.keys(candyProgress.wordStats)
                        .filter(w => candyProgress.wordStats[w].mastered)
                        .sort((a, b) => candyProgress.wordStats[a].lastSeen - candyProgress.wordStats[b].lastSeen);
                    for (const w of mastered) {
                        if (selected.length >= config.pairCount) break;
                        if (selected.some(s => s.word === w)) continue;
                        const wd = WORD_BANK.find(x => x.word === w);
                        if (wd) selected.push(wd);
                    }
                }
                while (selected.length < config.pairCount) {
                    const rand = WORD_BANK[Math.floor(Math.random() * WORD_BANK.length)];
                    if (!selected.some(s => s.word === rand.word)) selected.push(rand);
                }
                return selected.slice(0, config.pairCount);
            }

            function candyRecordWord(word, level) {
                if (!candyProgress.wordStats[word]) {
                    candyProgress.wordStats[word] = {
                        learned: 0, lastSeen: level, nextReview: level + 1, mastered: false
                    };
                }
                const stat = candyProgress.wordStats[word];
                stat.learned++;
                stat.lastSeen = level;
                const intervals = [1, 3, 7, 15, 30];
                if (stat.learned <= intervals.length) {
                    stat.nextReview = level + intervals[stat.learned - 1];
                } else {
                    stat.mastered = true;
                    stat.nextReview = Infinity;
                }
                candySaveProgress();
            }

            function candyGetMasteredCount() {
                return Object.values(candyProgress.wordStats).filter(w => w.mastered).length;
            }
            function candyTotalStars() {
                return Object.values(candyProgress.levelStars).reduce((a, b) => a + b, 0);
            }
            function candyUpdateStars(stars) {
                const s = candyStarsDisplay.querySelectorAll('.star');
                s.forEach((el, idx) => {
                    if (idx < stars) {
                        el.textContent = '★';
                        el.classList.add('earned');
                        el.style.color = '#ffb800';
                    } else {
                        el.textContent = '☆';
                        el.classList.remove('earned');
                        el.style.color = '#aaa';
                    }
                });
            }

            function candyRenderHome() {
                candyCurrentLevel = candyProgress.currentLevel || 1;
                candyHomeLevel.textContent = candyCurrentLevel;
                candyHomeWords.textContent = candyGetMasteredCount();
                candyHomeStars.textContent = candyTotalStars();
                const percent = Math.max(1, (candyCurrentLevel / CANDY_TOTAL_LEVELS) * 100);
                candyProgressFill.style.width = percent + '%';
                candyProgressFill.textContent = candyCurrentLevel + ' / ' + CANDY_TOTAL_LEVELS;
                candyContinueLevel.textContent = candyCurrentLevel;
                candyJumpInput.value = candyCurrentLevel;
            }

            function candyBuildCards(words) {
                const newCards = [];
                words.forEach((wd, idx) => {
                    const pairType = Math.random() < 0.5 ? 'letter' : 'image';
                    if (pairType === 'letter') {
                        const firstLetter = wd.word[0].toUpperCase();
                        newCards.push({
                            id: `cl-${candyCurrentLevel}-${idx}-${Date.now()}-${Math.random()}`,
                            type: 'letter', content: firstLetter,
                            pairId: idx, pairKey: wd.word, matched: false, isDecoy: false
                        });
                    } else {
                        newCards.push({
                            id: `ci-${candyCurrentLevel}-${idx}-${Date.now()}-${Math.random()}`,
                            type: 'image', content: wd.emoji,
                            pairId: idx, pairKey: wd.word, matched: false, isDecoy: false
                        });
                    }
                    newCards.push({
                        id: `cw-${candyCurrentLevel}-${idx}-${Date.now()}-${Math.random()}`,
                        type: 'word', content: wd.word,
                        pairId: idx, pairKey: wd.word, matched: false, isDecoy: false
                    });
                });
                if (candyConfig && candyConfig.decoys > 0) {
                    const decoyEmojis = ['👻', '🎃', '🦄', '🐉', '🍀', '💎', '🔮', '🎈'];
                    for (let i = 0; i < candyConfig.decoys; i++) {
                        newCards.push({
                            id: `cd-${candyCurrentLevel}-${i}-${Date.now()}-${Math.random()}`,
                            type: 'image', content: decoyEmojis[i % decoyEmojis.length],
                            pairId: -1, pairKey: '', matched: false, isDecoy: true
                        });
                    }
                }
                return shuffleArray(newCards);
            }

            function candyUpdateStats() {
                candyPairsMatchedSpan.textContent = candyMatched;
                candyMovesSpan.textContent = candyMoves;
                const percent = (candyMatched / candyConfig.pairCount) * 100;
                candyProgressGame.style.width = percent + '%';
                candyLevelDisplay.textContent = `第 ${candyCurrentLevel} / ${CANDY_TOTAL_LEVELS} 关`;
            }

            function candyRenderBoard() {
                candyBoard.innerHTML = '';
                candyCards.forEach(card => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'card-candy';
                    cardDiv.dataset.type = card.type;
                    cardDiv.dataset.id = card.id;
                    if (card.matched) cardDiv.classList.add('eliminated');
                    if (card.isDecoy) cardDiv.classList.add('decoy');
                    if (candySelectedId === card.id && !card.matched) cardDiv.classList.add('selected');

                    if (card.type === 'letter') {
                        cardDiv.innerHTML = `<span style="font-size:inherit;">${card.content}</span>`;
                    } else if (card.type === 'image') {
                        cardDiv.innerHTML = `<span style="font-size:inherit;">${card.content}</span>`;
                    } else {
                        cardDiv.innerHTML = `<div class="word-text">${card.content}</div>`;
                    }

                    cardDiv.addEventListener('click', (e) => {
                        if (card.matched) return;
                        if (card.type === 'word') speakWord(card.content);
                        else if (card.type === 'letter') speakLetter(card.content);
                        else if (card.type === 'image' && !card.isDecoy) {
                            const wordCard = candyCards.find(c => c.pairId === card.pairId && c.type === 'word');
                            if (wordCard) speakWord(wordCard.content);
                        }
                        candyHandleClick(card.id, e);
                    });
                    candyBoard.appendChild(cardDiv);
                });
            }

            function candyHandleClick(cardId, event) {
                if (candyFinished || candyLock || !candyGameActive) return;
                initAudio();
                const card = candyCards.find(c => c.id === cardId);
                if (!card || card.matched) return;

                if (card.isDecoy) {
                    card.matched = true;
                    const el = document.querySelector(`.card-candy[data-id="${card.id}"]`);
                    if (el) { el.classList.add('eliminated'); el.style.opacity = '0.3'; }
                    candyMessage.textContent = '👻 捣蛋卡消失啦！';
                    if (candySelectedId !== null) {
                        const prev = candyCards.find(c => c.id === candySelectedId);
                        if (prev) prev.selected = false;
                        candySelectedId = null;
                    }
                    candyRenderBoard();
                    return;
                }

                if (candySelectedId === null) {
                    candySelectedId = cardId;
                    playSelectSound();
                    candyRenderBoard();
                    return;
                }
                const firstCard = candyCards.find(c => c.id === candySelectedId);
                if (!firstCard || firstCard.matched) {
                    candySelectedId = cardId;
                    playSelectSound();
                    candyRenderBoard();
                    return;
                }
                if (candySelectedId === cardId) {
                    candySelectedId = null;
                    playSelectSound();
                    candyRenderBoard();
                    return;
                }

                candyMoves++;
                candyMovesSpan.textContent = candyMoves;

                let isMatch = false;
                let matchedWord = '';
                const t1 = firstCard.type, t2 = card.type;

                if ((t1 === 'letter' && t2 === 'word') || (t1 === 'word' && t2 === 'letter')) {
                    const l = t1 === 'letter' ? firstCard : card;
                    const w = t1 === 'word' ? firstCard : card;
                    if (w.content[0].toUpperCase() === l.content.toUpperCase()) {
                        isMatch = true;
                        matchedWord = w.content;
                    }
                } else if ((t1 === 'image' && t2 === 'word') || (t1 === 'word' && t2 === 'image')) {
                    const i = t1 === 'image' ? firstCard : card;
                    const w = t1 === 'word' ? firstCard : card;
                    if (i.pairId === w.pairId) {
                        isMatch = true;
                        matchedWord = w.content;
                    }
                }

                const rect = event ? event.target.getBoundingClientRect() :
                    { left: window.innerWidth / 2, top: window.innerHeight / 2 };
                const clickX = rect.left + rect.width / 2;
                const clickY = rect.top + rect.height / 2;

                if (isMatch) {
                    firstCard.matched = true;
                    card.matched = true;
                    candyMatched++;
                    candySelectedId = null;
                    candyUpdateStats();
                    candyRenderBoard();
                    playMatchSound();
                    createStars(clickX, clickY, 6);
                    showAnimalBubble(clickX, clickY, ['dog', 'cat', 'bird', 'duck'][Math.floor(Math.random() * 4)]);
                    setTimeout(() => speakWord(matchedWord, 1.0), 200);
                    candyMessage.textContent = `✔️ 正确！${matchedWord} 配对成功！`;
                    candyRecordWord(matchedWord, candyCurrentLevel);
                    candyCheckComplete();
                } else {
                    candySelectedId = null;
                    candyRenderBoard();
                    playErrorSound();
                    candyMessage.textContent = `❌ 不对应，再试试看！`;
                    setTimeout(() => {
                        if (!candyFinished && candyMessage.textContent.includes('不对应')) {
                            candyMessage.textContent = '👆 点一点卡片，配对它们吧！';
                        }
                    }, 800);
                }
            }

            function candyCheckComplete() {
                if (candyMatched === candyConfig.pairCount) {
                    candyFinished = true;
                    candyGameActive = false;
                    stopCandyTimer();
                    let stars = 3;
                    if (candyMoves > candyConfig.pairCount * 3) stars = 1;
                    else if (candyMoves > candyConfig.pairCount * 2) stars = 2;
                    candyUpdateStars(stars);

                    const prev = candyProgress.levelStars[candyCurrentLevel] || 0;
                    if (stars > prev) candyProgress.levelStars[candyCurrentLevel] = stars;
                    if (candyCurrentLevel >= candyProgress.currentLevel) {
                        candyProgress.currentLevel = Math.min(CANDY_TOTAL_LEVELS, candyCurrentLevel + 1);
                    }
                    candySaveProgress();

                    candyMessage.textContent = '🎉 太棒了！本关完成！';
                    candyNextBtn.disabled = false;
                    createConfetti(30);
                    speakEncouragement(stars);
                    setTimeout(() => showCandyCompleteModal(stars), 600);
                } else {
                    candyNextBtn.disabled = true;
                }
            }

            function stopCandyTimer() {
                if (candyTimerInterval) {
                    clearInterval(candyTimerInterval);
                    candyTimerInterval = null;
                }
                candyGameActive = false;
            }

            function startCandyTimer() {
                if (!candyConfig.timeLimit) return;
                stopCandyTimer();
                candyTimeLeft = candyConfig.timeLimit;
                candyTimerValue.textContent = candyTimeLeft;
                candyTimerBox.classList.remove('warning');
                candyGameActive = true;
                candyTimerInterval = setInterval(() => {
                    if (!candyGameActive) return;
                    candyTimeLeft--;
                    candyTimerValue.textContent = candyTimeLeft;
                    if (candyTimeLeft <= 10) candyTimerBox.classList.add('warning');
                    if (candyTimeLeft <= 0) {
                        stopCandyTimer();
                        candyMessage.textContent = '⏰ 时间到！';
                        candyLock = true;
                        showCandyTimeUpModal();
                    }
                }, 1000);
            }

                            <button class="modal-btn secondary" id="candyHomeModalBtn">🏠 首页</button>
                        </div>
                    </div>
                `;

                if (nextM) {
                    nextM.addEventListener('click', () => {
                        overlay.remove();
                        candyCurrentLevel = Math.min(CANDY_TOTAL_LEVELS, candyCurrentLevel + 1);
                        candyProgress.currentLevel = candyCurrentLevel;
                        candySaveProgress();
                        candyLoadLevel(candyCurrentLevel);
                    });
                }
                document.getElementById('candyRetryModalBtn').addEventListener('click', () => {
                    overlay.remove(); candyLoadLevel(candyCurrentLevel);
                });
                document.getElementById('candyHomeModalBtn').addEventListener('click', () => {
                    overlay.remove(); candyRenderHome(); hideAllScreens();
                    document.getElementById('candy-home').classList.remove('hidden');
                });
