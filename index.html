            function candyLoadLevel(level) {
                if (level < 1 || level > CANDY_TOTAL_LEVELS) return;
                stopCandyTimer();
                if (candyTimeoutId) { clearTimeout(candyTimeoutId); candyTimeoutId = null; }
                if (speechSynth) speechSynth.cancel();

                candyCurrentLevel = level;
                candyConfig = candyGetLevelConfig(level);
                candyCurrentWords = candySelectWordsForLevel(level);
                candyCards = candyBuildCards(candyCurrentWords);
                candySelectedId = null;
                candyMatched = 0;
                candyMoves = 0;
                candyFinished = false;
                candyLock = false;
                candyGameActive = true;
                candyNextBtn.disabled = true;

                candyUpdateStars(0);
                if (candyConfig.timeLimit) {
                    candyTimerBox.style.display = 'flex';
                    candyTimeLeft = candyConfig.timeLimit;
                    candyTimerValue.textContent = candyTimeLeft;
                    candyTimerBox.classList.remove('warning');
                } else {
                    candyTimerBox.style.display = 'none';
                }

                candyGameHint.textContent = `🧠 ${candyConfig.phase} · ${candyConfig.pairCount}对 · 复习 ${candyConfig.reviewWordCount}`;
                candyMessage.textContent = `第 ${candyCurrentLevel} 关：点一点卡片，配对它们吧！`;
                candyUpdateStats();
                candyRenderBoard();
                if (candyConfig.timeLimit) startCandyTimer();
            }

            function candyStart(level) {
                hideAllScreens();
                document.getElementById('candy-game').classList.remove('hidden');
                candyLoadLevel(level);
            }

            candyResetLevel.addEventListener('click', () => candyLoadLevel(candyCurrentLevel));
            candyNextBtn.addEventListener('click', () => {
                if (candyCurrentLevel < CANDY_TOTAL_LEVELS) candyLoadLevel(candyCurrentLevel + 1);
            });
            candyBackHome.addEventListener('click', () => {
                if (speechSynth) speechSynth.cancel();
                stopCandyTimer();
                candyRenderHome();
                hideAllScreens();
                document.getElementById('candy-home').classList.remove('hidden');
            });
            candyContinueBtn.addEventListener('click', () => candyStart(candyProgress.currentLevel || 1));
            candyJumpBtn.addEventListener('click', () => {
                const val = parseInt(candyJumpInput.value);
                if (isNaN(val) || val < 1 || val > CANDY_TOTAL_LEVELS) {
                    alert('请输入 1 - ' + CANDY_TOTAL_LEVELS);
                    return;
                }
                candyStart(val);
            });
            candyResetBtn.addEventListener('click', () => {
                if (confirm('确定重置消消乐进度吗？')) {
                    candyProgress = { currentLevel: 1, levelStars: {}, wordStats: {} };
                    candySaveProgress();
                    candyRenderHome();
                }
            });

            // ============================================================
            // 记忆闯关模式（1000 关，每关至少 6 对）
            // ============================================================
            const MEMORY_TOTAL_LEVELS = 1000;

            function memoryGetLevelConfig(level) {
                let pairCount;
                if (level <= 100) pairCount = 6;
                else if (level <= 300) pairCount = 7;
                else if (level <= 600) pairCount = 8;
                else if (level <= 900) pairCount = 9;
                else pairCount = 10;

                let newWordCount, reviewWordCount;
                if (level <= 100) { newWordCount = 3; reviewWordCount = pairCount - newWordCount; }
                else if (level <= 300) { newWordCount = 3; reviewWordCount = pairCount - newWordCount; }
                else if (level <= 600) { newWordCount = 4; reviewWordCount = pairCount - newWordCount; }
                else { newWordCount = 4; reviewWordCount = pairCount - newWordCount; }
                if (reviewWordCount < 0) reviewWordCount = 0;

                let timeLimit = null;
                if (level > 300) timeLimit = Math.max(40, 100 - Math.floor((level - 300) / 20));
                if (level > 800) timeLimit = Math.max(30, 70 - Math.floor((level - 800) / 30));

                let decoys = 0;
                if (level > 500) decoys = 1;
                if (level > 800) decoys = 2;

                let phase;
                if (level <= 100) phase = '入门';
                else if (level <= 300) phase = '基础';
                else if (level <= 600) phase = '进阶';
                else if (level <= 800) phase = '强化';
                else phase = '大师';

                return { pairCount, newWordCount, reviewWordCount, timeLimit, decoys, phase };
            }

            let memoryProgress = memoryLoadProgress();
            function memoryLoadProgress() {
                try {
                    const saved = localStorage.getItem('memoryProgress');
                    if (saved) {
                        const d = JSON.parse(saved);
                        return {
                            currentLevel: d.currentLevel || 1,
                            wordStats: d.wordStats || {},
                            levelStars: d.levelStars || {}
                        };
                    }
                } catch (e) {}
                return { currentLevel: 1, wordStats: {}, levelStars: {} };
            }
            function memorySaveProgress() {
                try { localStorage.setItem('memoryProgress', JSON.stringify(memoryProgress)); } catch (e) {}
            }

            let memoryCurrentLevel = 1;
            let memoryCards = [];
            let memorySelectedIdx = null;
            let memoryMatched = 0;
            let memoryAttempts = 0;
            let memoryLock = false;
            let memoryTimeoutId = null;
            let memoryTimerInterval = null;
            let memoryTimeLeft = 0;
            let memoryGameActive = false;
            let memoryConfig = null;
            let memoryCurrentWords = [];

            const memoryBoard = document.getElementById('memoryBoard');
            const memoryLevelBadge = document.getElementById('memoryLevelBadge');
            const memoryPairsMatchedSpan = document.getElementById('memoryPairsMatched');
            const memoryAttemptsSpan = document.getElementById('memoryAttempts');
            const memoryMessage = document.getElementById('memoryMessage');
            const memoryResetLevel = document.getElementById('memoryResetLevel');
            const memoryBackHome = document.getElementById('memoryBackHome');
            const memoryStarsDisplay = document.getElementById('memoryStarsDisplay');
            const memoryTimerBox = document.getElementById('memoryTimerBox');
            const memoryTimerValue = document.getElementById('memoryTimerValue');
            const memorySoundToggle = document.getElementById('memorySoundToggle');
            const memorySoundIcon = document.getElementById('memorySoundIcon');
            const memorySoundText = document.getElementById('memorySoundText');
            const memoryGameHint = document.getElementById('memoryGameHint');
            const memoryHomeLevel = document.getElementById('memoryHomeLevel');
            const memoryHomeMastered = document.getElementById('memoryHomeMastered');
            const memoryHomeStars = document.getElementById('memoryHomeStars');
            const memoryProgressFill = document.getElementById('memoryProgressFill');
            const memoryContinueBtn = document.getElementById('memoryContinueBtn');
            const memoryContinueLevel = document.getElementById('memoryContinueLevel');
            const memoryJumpInput = document.getElementById('memoryJumpInput');
            const memoryJumpBtn = document.getElementById('memoryJumpBtn');
            const memoryResetBtn = document.getElementById('memoryResetBtn');

            function memoryGetMastered() {
                return Object.values(memoryProgress.wordStats).filter(w => w.mastered).length;
            }
            function memoryGetStars() {
                return Object.values(memoryProgress.levelStars).reduce((a, b) => a + b, 0);
            }

            function memoryRenderHome() {
                memoryCurrentLevel = memoryProgress.currentLevel || 1;
                memoryHomeLevel.textContent = memoryCurrentLevel;
                memoryHomeMastered.textContent = memoryGetMastered();
                memoryHomeStars.textContent = memoryGetStars();
                const percent = Math.max(1, (memoryCurrentLevel / MEMORY_TOTAL_LEVELS) * 100);
                memoryProgressFill.style.width = percent + '%';
                memoryProgressFill.textContent = memoryCurrentLevel + ' / ' + MEMORY_TOTAL_LEVELS;
                memoryContinueLevel.textContent = memoryCurrentLevel;
                memoryJumpInput.value = memoryCurrentLevel;
            }

            function memorySelectWords(level) {
                const config = memoryGetLevelConfig(level);
                const selected = [];
                const reviewCandidates = [];
                Object.keys(memoryProgress.wordStats).forEach(word => {
                    const stat = memoryProgress.wordStats[word];
                    if (!stat.mastered && stat.nextReview <= level) {
                        reviewCandidates.push({ word, ...stat });
                    }
                });
                reviewCandidates.sort((a, b) => a.nextReview - b.nextReview);
                for (let i = 0; i < config.reviewWordCount && i < reviewCandidates.length; i++) {
                    const r = reviewCandidates[i];
                    const wd = WORD_BANK.find(w => w.word === r.word);
                    if (wd) selected.push(wd);
                }
                const unseen = WORD_BANK.filter(w => !memoryProgress.wordStats[w.word]);
                for (let i = 0; i < config.newWordCount && i < unseen.length; i++) {
                    selected.push(unseen[i]);
                }
                if (selected.length < config.pairCount) {
                    const mastered = Object.keys(memoryProgress.wordStats)
                        .filter(w => memoryProgress.wordStats[w].mastered)
                        .sort((a, b) => memoryProgress.wordStats[a].lastSeen - memoryProgress.wordStats[b].lastSeen);
                    for (const w of mastered) {
                        if (selected.length >= config.pairCount) break;
                        if (selected.some(s => s.word === w)) continue;
                        const wd = WORD_BANK.find(x => x.word === w);
                        if (wd) selected.push(wd);
                    }
                }
                while (selected.length < config.pairCount) {
                    const rand = WORD_BANK[Math.floor(Math.random() * WORD_BANK.length)];
                    if (!selected.some(s => s.word === rand.word)) selected.push(rand);
                }
                return selected.slice(0, config.pairCount);
            }

            function memoryRecordWord(word, level) {
                if (!memoryProgress.wordStats[word]) {
                    memoryProgress.wordStats[word] = {
                        learned: 0, lastSeen: level, nextReview: level + 1, mastered: false
                    };
                }
                const stat = memoryProgress.wordStats[word];
                stat.learned++;
                stat.lastSeen = level;
                const intervals = [1, 3, 7, 15, 30];
                if (stat.learned <= intervals.length) {
                    stat.nextReview = level + intervals[stat.learned - 1];
                } else {
                    stat.mastered = true;
                    stat.nextReview = Infinity;
                }
                memorySaveProgress();
            }

            function memoryBuildCards(pairs, decoys = 0) {
                const newCards = [];
                pairs.forEach((pair, pairId) => {
                    newCards.push({
                        pairId, type: 'word', content: pair.word, word: pair.word,
                        matched: false, isDecoy: false
                    });
                    newCards.push({
                        pairId, type: 'emoji', content: pair.emoji, word: pair.word,
                        matched: false, isDecoy: false
                    });
                });
                if (decoys > 0) {
                    const decoyEmojis = ['👻', '🎃', '🦄', '🐉', '🍀', '💎', '🔮', '🎈'];
                    for (let i = 0; i < decoys; i++) {
                        newCards.push({
                            pairId: -1, type: 'emoji',
                            content: decoyEmojis[i % decoyEmojis.length],
                            matched: false, isDecoy: true
                        });
                    }
                }
                return shuffleArray(newCards);
            }

            function memoryUpdateStats() {
                memoryPairsMatchedSpan.textContent = memoryMatched;
                memoryAttemptsSpan.textContent = memoryAttempts;
            }

            function memorySetMessage(text, isGood = true) {
                memoryMessage.textContent = text;
                memoryMessage.style.background = isGood ?
                    'linear-gradient(135deg, #fff8e1, #ffecb3)' :
                    'linear-gradient(135deg, #ffcdd2, #ef9a9a)';
            }

            function memoryUpdateStars(starCount) {
                const stars = memoryStarsDisplay.querySelectorAll('.star');
                stars.forEach((star, idx) => {
                    if (idx < starCount) {
                        star.textContent = '★';
                        star.classList.add('earned');
                        star.style.color = '#ffb800';
                    } else {
                        star.textContent = '☆';
                        star.classList.remove('earned');
                        star.style.color = '#aaa';
                    }
                });
            }

            function memoryCalculateStars(pairCount, attempts) {
                if (attempts <= pairCount + 2) return 3;
                if (attempts <= Math.ceil(pairCount * 1.8)) return 2;
                return 1;
            }

            function memoryRenderLevelInfo() {
                memoryLevelBadge.textContent = `第 ${memoryCurrentLevel} 关`;
                if (memoryConfig.timeLimit) {
                    memoryTimerBox.style.display = 'flex';
                    memoryTimeLeft = memoryConfig.timeLimit;
                    memoryTimerValue.textContent = memoryTimeLeft;
                    memoryTimerBox.classList.remove('warning');
                } else {
                    memoryTimerBox.style.display = 'none';
                }
                const newCount = memoryCurrentWords.filter(w => {
                    const stat = memoryProgress.wordStats[w.word];
                    return !stat || stat.learned <= 1;
                }).length;
                const reviewCount = memoryConfig.pairCount - newCount;
                memoryGameHint.textContent = `🧠 ${memoryConfig.phase}阶段 · ${memoryConfig.pairCount}对 · 新词 ${newCount} · 复习 ${reviewCount}`;
                memoryUpdateStars(0);
            }

            function memoryStopTimer() {
                if (memoryTimerInterval) {
                    clearInterval(memoryTimerInterval);
                    memoryTimerInterval = null;
                }
                memoryGameActive = false;
            }

            function memoryStartTimer() {
                if (!memoryConfig.timeLimit) return;
                memoryStopTimer();
                memoryTimeLeft = memoryConfig.timeLimit;
                memoryTimerValue.textContent = memoryTimeLeft;
                memoryTimerBox.classList.remove('warning');
                memoryGameActive = true;
                memoryTimerInterval = setInterval(() => {
                    if (!memoryGameActive) return;
                    memoryTimeLeft--;
                    memoryTimerValue.textContent = memoryTimeLeft;
                    if (memoryTimeLeft <= 10) memoryTimerBox.classList.add('warning');
                    if (memoryTimeLeft <= 0) {
                        memoryStopTimer();
                        memorySetMessage('⏰ 时间到！', false);
                        memoryLock = true;
                        memoryShowTimeUpModal();
                    }
                }, 1000);
            }

            function memoryShowTimeUpModal() {
                const overlay = document.createElement('div');
                overlay.className = 'overlay';
                overlay.innerHTML = `
                    <div class="modal">
                        <h2>⏰ 时间到啦</h2>
                        <div class="big-stars">😢</div>
                        <div class="encourage-text">别灰心，再试一次一定可以！</div>
                        <div class="modal-buttons">
                            <button class="modal-btn primary" id="memRetryBtn">🔄 重玩本关</button>
                            <button class="modal-btn secondary" id="memHomeBtn">🏠 首页</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);
                document.getElementById('memRetryBtn').addEventListener('click', () => {
                    overlay.remove(); memoryLoadLevel(memoryCurrentLevel);
                });
                document.getElementById('memHomeBtn').addEventListener('click', () => {
                    overlay.remove(); memoryRenderHome(); hideAllScreens();
                    document.getElementById('memory-home').classList.remove('hidden');
                });
            }

            function memoryShowCompleteModal(stars) {
                const isLast = memoryCurrentLevel === MEMORY_TOTAL_LEVELS;
                const encourage = getEncourageText(stars);
                const overlay = document.createElement('div');
                overlay.className = 'overlay';
                overlay.innerHTML = `
                    <div class="modal">
                        <h2>${isLast ? '🏆 全部通关！' : '🎉 第 ' + memoryCurrentLevel + ' 关完成！'}</h2>
                        <div class="big-stars">
                            <span class="big-star">${stars >= 1 ? '★' : '☆'}</span>
                            <span class="big-star">${stars >= 2 ? '★' : '☆'}</span>
                            <span class="big-star">${stars >= 3 ? '★' : '☆'}</span>
                        </div>
                        <div class="encourage-text">${encourage}</div>
                        <div class="modal-buttons">
                            ${!isLast ? '<button class="modal-btn primary" id="memNextBtn">➡️ 下一关</button>' : ''}
                            <button class="modal-btn secondary" id="memRetryBtn2">🔄 重玩</button>
                            <button class="modal-btn secondary" id="memHomeBtn2">🏠 首页</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);
                const nextBtn = document.getElementById('memNextBtn');
                if (nextBtn) {
                    nextBtn.addEventListener('click', () => {
                        overlay.remove();
                        memoryProgress.currentLevel = Math.min(MEMORY_TOTAL_LEVELS, memoryCurrentLevel + 1);
                        memorySaveProgress();
                        memoryCurrentLevel = memoryProgress.currentLevel;
                        memoryLoadLevel(memoryCurrentLevel);
                    });
                }
                document.getElementById('memRetryBtn2').addEventListener('click', () => {
                    overlay.remove(); memoryLoadLevel(memoryCurrentLevel);
                });
                document.getElementById('memHomeBtn2').addEventListener('click', () => {
                    overlay.remove(); memoryRenderHome(); hideAllScreens();
                    document.getElementById('memory-home').classList.remove('hidden');
                });
            }

            function memoryRenderBoard() {
                if (memoryTimeoutId) { clearTimeout(memoryTimeoutId); memoryTimeoutId = null; }
                memoryBoard.innerHTML = '';
                memoryCards.forEach((card, index) => {
                    const cardEl = document.createElement('div');
                    cardEl.className = `card-memory ${card.matched ? 'matched' : ''} ${card.isDecoy ? 'decoy' : ''}`;
                    cardEl.dataset.index = index;

                    if (card.type === 'word') {
                        const wordSpan = document.createElement('div');
                        wordSpan.className = 'word-text';
                        wordSpan.textContent = card.content;
                        cardEl.appendChild(wordSpan);
                        const speakerBtn = document.createElement('button');
                        speakerBtn.className = 'speaker-btn';
                        speakerBtn.textContent = '🔊';
                        speakerBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            speakWord(card.content);
                        });
                        cardEl.appendChild(speakerBtn);
                    } else {
                        const emojiSpan = document.createElement('div');
                        emojiSpan.className = 'emoji';
                        emojiSpan.textContent = card.content;
                        cardEl.appendChild(emojiSpan);
                    }

                    cardEl.addEventListener('click', () => memoryHandleClick(index));
                    memoryBoard.appendChild(cardEl);
                });
                memoryUpdateStats();
            }

            function memoryHandleClick(index) {
                if (memoryLock || !memoryGameActive) return;
                const card = memoryCards[index];
                if (card.matched) return;

                if (card.isDecoy) {
                    memoryCards[index].matched = true;
                    const el = document.querySelector(`.card-memory[data-index="${index}"]`);
                    if (el) { el.classList.add('matched'); el.style.opacity = '0.3'; }
                    memorySetMessage('👻 捣蛋卡消失啦！', true);
                    if (memorySelectedIdx !== null) {
                        const prev = document.querySelector(`.card-memory[data-index="${memorySelectedIdx}"]`);
                        if (prev) prev.classList.remove('selected');
                        memorySelectedIdx = null;
                    }
                    return;
                }

                const cardEl = document.querySelector(`.card-memory[data-index="${index}"]`);
                if (!cardEl) return;

                if (card.type === 'word') speakWord(card.content);
                if (card.type === 'emoji' && card.word) speakWord(card.word);

                if (memorySelectedIdx === null) {
                    memorySelectedIdx = index;
                    cardEl.classList.add('selected');
                    memorySetMessage(`👉 已选中: ${card.type === 'word' ? card.content : '图片'}`, true);
                    return;
                }

                const firstIdx = memorySelectedIdx;
                const firstCard = memoryCards[firstIdx];
                const firstEl = document.querySelector(`.card-memory[data-index="${firstIdx}"]`);

                if (firstIdx === index) {
                    if (firstEl) firstEl.classList.remove('selected');
                    memorySelectedIdx = null;
                    memorySetMessage('✨ 已取消选择', true);
                    return;
                }

                memoryLock = true;
                memoryAttempts++;
                memoryUpdateStats();

                const isMatch = (firstCard.pairId === card.pairId) &&
                                (firstCard.type !== card.type) &&
                                (!firstCard.isDecoy && !card.isDecoy);

                if (isMatch) {
                    const matchedWord = firstCard.type === 'word' ? firstCard.content : card.content;
                    setTimeout(() => speakWord(matchedWord), 150);
                    memoryMatched++;
                    memoryCards[firstIdx].matched = true;
                    memoryCards[index].matched = true;
                    if (firstEl) { firstEl.classList.remove('selected'); firstEl.classList.add('matched'); }
                    cardEl.classList.add('matched');
                    memoryRecordWord(matchedWord, memoryCurrentLevel);
                    memorySetMessage(`✅ ${matchedWord} 配对成功!`, true);
                    memorySelectedIdx = null;
                    memoryLock = false;
                    memoryCheckWin();
                } else {
                    memorySetMessage(`❌ 配对失败，再试试`, false);
                    if (firstEl) {
                        firstEl.classList.remove('selected');
                        firstEl.style.border = '3px solid #e74c3c';
                        setTimeout(() => { firstEl.style.border = ''; }, 300);
                    }
                    cardEl.style.border = '3px solid #e74c3c';
                    setTimeout(() => { cardEl.style.border = ''; }, 300);
                    memoryTimeoutId = setTimeout(() => {
                        if (firstEl) firstEl.classList.remove('selected');
                        if (firstEl) firstEl.style.border = '';
                        cardEl.style.border = '';
                        memorySelectedIdx = null;
                        memoryLock = false;
                        memoryTimeoutId = null;
                        memorySetMessage('💪 继续加油！', true);
                    }, 700);
                }
            }

            function memoryCheckWin() {
                if (memoryMatched === memoryConfig.pairCount) {
                    memoryStopTimer();
                    memoryGameActive = false;
                    const stars = memoryCalculateStars(memoryConfig.pairCount, memoryAttempts);
                    memoryUpdateStars(stars);
                    const prev = memoryProgress.levelStars[memoryCurrentLevel] || 0;
                    if (stars > prev) memoryProgress.levelStars[memoryCurrentLevel] = stars;
                    if (memoryCurrentLevel >= memoryProgress.currentLevel) {
                        memoryProgress.currentLevel = Math.min(MEMORY_TOTAL_LEVELS, memoryCurrentLevel + 1);
                    }
                    memorySaveProgress();
                    speakEncouragement(stars);
                    setTimeout(() => memoryShowCompleteModal(stars), 500);
                }
            }

            function memoryLoadLevel(level) {
                memoryStopTimer();
                if (memoryTimeoutId) { clearTimeout(memoryTimeoutId); memoryTimeoutId = null; }
                if (speechSynth) speechSynth.cancel();

                memoryCurrentLevel = level;
                memorySelectedIdx = null;
                memoryLock = false;
                memoryMatched = 0;
                memoryAttempts = 0;
                memoryGameActive = true;

                memoryConfig = memoryGetLevelConfig(level);
                memoryCurrentWords = memorySelectWords(level);
                memoryRenderLevelInfo();
                memoryCards = memoryBuildCards(memoryCurrentWords, memoryConfig.decoys);
                memoryRenderBoard();
                if (memoryConfig.timeLimit) memoryStartTimer();
                memorySetMessage('✨ 点击卡片，配对单词和图片吧！', true);
                memoryUpdateStats();
            }

            function memoryStart(level) {
                hideAllScreens();
                document.getElementById('memory-game').classList.remove('hidden');
                memoryLoadLevel(level);
            }

            memoryResetLevel.addEventListener('click', () => memoryLoadLevel(memoryCurrentLevel));
            memoryBackHome.addEventListener('click', () => {
                if (speechSynth) speechSynth.cancel();
                memoryStopTimer();
                memoryRenderHome();
                hideAllScreens();
                document.getElementById('memory-home').classList.remove('hidden');
            });
            memoryContinueBtn.addEventListener('click', () => memoryStart(memoryProgress.currentLevel || 1));
            memoryJumpBtn.addEventListener('click', () => {
                const val = parseInt(memoryJumpInput.value);
                if (isNaN(val) || val < 1 || val > MEMORY_TOTAL_LEVELS) {
                    alert('请输入 1 - ' + MEMORY_TOTAL_LEVELS);
                    return;
                }
                memoryStart(val);
            });
            memoryResetBtn.addEventListener('click', () => {
                if (confirm('确定重置记忆闯关进度吗？')) {
                    memoryProgress = { currentLevel: 1, wordStats: {}, levelStars: {} };
                    memorySaveProgress();
                    memoryRenderHome();
                }
            });
            memorySoundToggle.addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                if (!soundEnabled) {
                    if (speechSynth) speechSynth.cancel();
                    memorySoundIcon.textContent = '🔇';
                    memorySoundText.textContent = '静音';
                    memorySoundToggle.classList.add('muted');
                } else {
                    memorySoundIcon.textContent = '🔊';
                    memorySoundText.textContent = '童声';
                    memorySoundToggle.classList.remove('muted');
                }
            });

            // 启动
            document.body.addEventListener('click', function initAudioOnce() {
                initAudio();
                if (speechSynth && voices.length === 0) loadVoices();
                document.body.removeEventListener('click', initAudioOnce);
            }, { once: true });

            if (speechSynth) {
                loadVoices();
                speechSynth.onvoiceschanged = loadVoices;
            }

            window.addEventListener('DOMContentLoaded', () => {
                switchMode('candy');
            });

        })();
    </script>
</body>
</html>
