<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幼儿园英语 · 字母消消乐（趣味美式发音·精美字母版）</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(160deg, #6ec6ff 0%, #ffd3e0 50%, #c8e6c9 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
        }
        /* 背景漂浮小元素 */
        .bg-float {
            position: fixed;
            font-size: 2.5rem;
            opacity: 0.35;
            pointer-events: none;
            animation: floatUp 12s linear infinite;
            z-index: 0;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-20vh) rotate(360deg); }
        }
        .game-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 50px 50px 40px 40px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2), inset 0 3px 8px rgba(255, 255, 255, 0.8);
            padding: 18px 18px 25px;
            border: 4px solid #fff;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #fff9c4, #ffe082);
            border-radius: 60px;
            padding: 8px 16px;
            margin-bottom: 14px;
            box-shadow: 0 6px 0 #e6a817;
            border: 3px solid #ffb300;
        }
        .level-badge {
            background: #ff7043;
            border-radius: 40px;
            padding: 6px 16px;
            font-weight: bold;
            color: #fff;
            font-size: 1.2rem;
            box-shadow: inset 0 -3px 0 #bf360c, 0 2px 5px rgba(0,0,0,0.2);
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 0 #bf360c;
        }
        .stats {
            display: flex;
            gap: 10px;
            font-weight: bold;
            color: #5d4037;
            font-size: 1.1rem;
        }
        .stats span {
            background: #fff;
            padding: 5px 12px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 3px 0 #d7ccc8;
            border: 2px solid #ffb300;
        }
        .progress-bar {
            width: 100%;
            height: 18px;
            background: #e0e0e0;
            border-radius: 20px;
            margin-bottom: 12px;
            overflow: hidden;
            border: 2px solid #ffb300;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd54f, #ffb300, #ff8f00);
            border-radius: 20px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #ffca28;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            justify-content: center;
            margin: 12px 0 8px;
        }
        /* ===== 卡片通用样式 ===== */
        .card {
            aspect-ratio: 1 / 1;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            transition: 0.08s linear;
            position: relative;
            overflow: hidden;
            transform: translateY(-2px);
            text-transform: uppercase;
        }
        /* ===== 字母卡：精美大号字母 ===== */
        .card[data-type="letter"] {
            background: linear-gradient(145deg, #fff8e1, #ffe0b2);
            color: #e65100;
            font-size: 3.2rem;
            border: 4px solid #ffb300;
            box-shadow: 0 8px 0 #e6a817, 0 10px 15px rgba(0, 0, 0, 0.15),
                        inset 0 -4px 0 #ffcc80, inset 0 4px 0 #fff8e1;
            text-shadow: 2px 2px 0 #ffcc80, 0 0 8px #fff3e0;
            letter-spacing: -1px;
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
        }
        /* ===== 单词卡：简洁清晰 ===== */
        .card[data-type="word"] {
            background: linear-gradient(145deg, #e3f2fd, #bbdefb);
            color: #1565c0;
            font-size: 1.8rem;
            border: 4px solid #64b5f6;
            box-shadow: 0 8px 0 #42a5f5, 0 10px 15px rgba(0, 0, 0, 0.15),
                        inset 0 -4px 0 #90caf9, inset 0 4px 0 #e3f2fd;
            text-shadow: 1px 1px 0 #bbdefb;
            padding: 0 4px;
            word-break: break-all;
            line-height: 1.1;
        }
        /* 单词卡上的小喇叭图标 */
        .card[data-type="word"]::after {
            content: "🔊";
            position: absolute;
            bottom: 5px;
            right: 7px;
            font-size: 0.85rem;
            opacity: 0.7;
        }
        .card[data-type="word"].eliminated::after {
            display: none;
        }
        /* 选中状态 */
        .card.selected {
            box-shadow: 0 0 0 6px #ffd54f, 0 8px 0 #bcaaa4 !important;
            transform: scale(1.05) translateY(-2px) !important;
            filter: brightness(1.05);
            z-index: 3;
        }
        .card.selected[data-type="letter"] {
            box-shadow: 0 0 0 6px #ffd54f, 0 8px 0 #e6a817 !important;
        }
        .card.selected[data-type="word"] {
            box-shadow: 0 0 0 6px #ffd54f, 0 8px 0 #42a5f5 !important;
        }
        /* 消除状态 */
        .card.eliminated {
            background: #a5d6a7;
            box-shadow: 0 4px 0 #4caf50, 0 5px 8px rgba(0,0,0,0.1);
            transform: translateY(4px) scale(0.98);
            border-color: #66bb6a;
            cursor: default;
            opacity: 0.85;
            pointer-events: none;
            font-size: 0 !important;
            color: transparent;
        }
        .card.eliminated::after {
            content: "🌟" !important;
            font-size: 2.2rem !important;
            animation: pop 0.4s ease;
            position: static !important;
            opacity: 1 !important;
            right: auto !important;
            bottom: auto !important;
        }
        @keyframes pop {
            0% { transform: scale(0); }
            70% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .message-area {
            min-height: 58px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #5d4037;
            padding: 10px;
            background: linear-gradient(135deg, #fff8e1, #ffecb3);
            border-radius: 40px;
            margin: 10px 0;
            border: 3px dashed #ffb300;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #ffe082;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        button {
            background: linear-gradient(135deg, #ffb74d, #ff9800);
            border: none;
            border-radius: 40px;
            padding: 12px 18px;
            font-size: 1.05rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 6px 0 #e65100, 0 5px 10px rgba(0,0,0,0.2);
            transition: 0.06s linear;
            flex: 1;
            border: 2px solid #fff;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 0 #e65100;
        }
        button:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #e65100, 0 5px 10px rgba(0,0,0,0.1);
        }
        button:disabled {
            opacity: 0.45;
            transform: translateY(3px);
            box-shadow: 0 3px 0 #bf360c;
            pointer-events: none;
            filter: grayscale(0.5);
        }
        .memory-tip {
            font-size: 0.85rem;
            color: #5d4037;
            background: #fff3e0;
            border-radius: 30px;
            padding: 6px 14px;
            margin-top: 10px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 2px solid #ffcc80;
            box-shadow: 0 3px 0 #ffe0b2;
        }
        /* 星星飘落动画 */
        .star-fall {
            position: fixed;
            font-size: 1.8rem;
            pointer-events: none;
            z-index: 999;
            animation: starFall 1.2s ease-out forwards;
        }
        @keyframes starFall {
            0% { transform: translateY(0) rotate(0deg) scale(0); opacity: 1; }
            30% { transform: translateY(-30px) rotate(60deg) scale(1.2); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg) scale(0.8); opacity: 0; }
        }
        /* 动物叫声气泡 */
        .animal-bubble {
            position: fixed;
            background: #fff;
            border-radius: 50%;
            padding: 12px 14px;
            font-size: 1.8rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.25);
            border: 3px solid #ffb300;
            z-index: 1000;
            animation: bubblePop 0.8s ease-out forwards;
            pointer-events: none;
        }
        @keyframes bubblePop {
            0% { transform: scale(0) rotate(-20deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            pointer-events: none;
            z-index: 998;
            animation: confettiFall 1.5s ease-out forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        @media (max-width: 500px) {
            .board { gap: 7px; }
            .card[data-type="letter"] {
                font-size: 2.4rem;
                border-width: 3px;
                border-radius: 18px;
            }
            .card[data-type="word"] {
                font-size: 1.3rem;
                border-width: 3px;
                border-radius: 18px;
            }
            .card.eliminated::after { font-size: 1.6rem !important; }
            .stats { font-size: 0.9rem; gap: 6px; }
            .level-badge { font-size: 1rem; padding: 5px 10px; }
            .message-area { font-size: 1rem; }
            button { font-size: 0.9rem; padding: 10px 12px; }
            .card[data-type="word"]::after { font-size: 0.7rem; bottom: 3px; right: 5px; }
        }
    </style>
</head>
<body>
<!-- 背景漂浮小元素 -->
<div class="bg-float" style="left: 5%; animation-delay: 0s;">🐶</div>
<div class="bg-float" style="left: 20%; animation-delay: 3s;">🌈</div>
<div class="bg-float" style="left: 45%; animation-delay: 6s;">⭐</div>
<div class="bg-float" style="left: 70%; animation-delay: 2s;">🎈</div>
<div class="bg-float" style="left: 88%; animation-delay: 8s;">🐱</div>
<div class="bg-float" style="left: 35%; animation-delay: 10s;">🍎</div>
<div class="bg-float" style="left: 60%; animation-delay: 5s;">🐻</div>

<div class="game-wrapper">
    <div class="header">
        <div class="level-badge" id="levelDisplay">第 1 / 100 关</div>
        <div class="stats">
            <span>⭐ <span id="pairsMatched">0</span>/8</span>
            <span>🔤 <span id="moves">0</span></span>
        </div>
    </div>
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="board" id="board"></div>
    <div class="message-area" id="message">👆 点一点字母和单词，消掉它们吧！</div>
    <div class="controls">
        <button id="resetBtn">🔄 重玩本关</button>
        <button id="nextBtn" disabled>➡️ 下一关</button>
    </div>
    <div class="memory-tip">
        🧠 科学记忆 · 🔊 点击单词卡听美式发音 · 🎉 配对成功有惊喜
    </div>
</div>
<script>
    (function() {
        // ========== 1. Web Audio 音效引擎 ==========
        let audioCtx = null;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, duration = 0.1, type = 'sine', volume = 0.2) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gainNode.gain.value = volume;
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start();
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) { /* 静默 */ }
        }

        function playSelectSound() { playTone(880, 0.08, 'sine', 0.15); }
        function playMatchSound() {
            playTone(660, 0.1, 'triangle', 0.2);
            setTimeout(() => playTone(880, 0.12, 'triangle', 0.2), 80);
            setTimeout(() => playTone(1100, 0.15, 'triangle', 0.2), 160);
        }
        function playErrorSound() {
            playTone(300, 0.2, 'sawtooth', 0.1);
            setTimeout(() => playTone(220, 0.25, 'sawtooth', 0.1), 100);
        }
        function playLevelCompleteSound() {
            playTone(523, 0.15, 'sine', 0.2);
            setTimeout(() => playTone(659, 0.15, 'sine', 0.2), 120);
            setTimeout(() => playTone(784, 0.15, 'sine', 0.25), 240);
            setTimeout(() => playTone(1046, 0.3, 'sine', 0.25), 380);
        }
        function playNextLevelSound() {
            playTone(800, 0.1, 'square', 0.1);
            setTimeout(() => playTone(1000, 0.15, 'square', 0.1), 100);
        }
        function playAnimalSound(type) {
            try {
                initAudio();
                if (type === 'dog') {
                    playTone(400, 0.1, 'sawtooth', 0.15);
                    setTimeout(() => playTone(500, 0.1, 'sawtooth', 0.15), 120);
                } else if (type === 'cat') {
                    playTone(700, 0.15, 'sine', 0.2);
                    setTimeout(() => playTone(900, 0.2, 'sine', 0.15), 150);
                } else if (type === 'bird') {
                    playTone(1200, 0.08, 'sine', 0.2);
                    setTimeout(() => playTone(1500, 0.08, 'sine', 0.2), 100);
                    setTimeout(() => playTone(1300, 0.08, 'sine', 0.2), 200);
                } else if (type === 'duck') {
                    playTone(500, 0.12, 'square', 0.1);
                    setTimeout(() => playTone(450, 0.12, 'square', 0.1), 150);
                } else {
                    playTone(880, 0.08, 'sine', 0.2);
                    setTimeout(() => playTone(1100, 0.1, 'sine', 0.2), 90);
                }
            } catch (e) {}
        }

        // ========== 2. 美式英语朗读 ==========
        let speechSynth = window.speechSynthesis || null;
        let voices = [];
        let americanVoice = null;

        function loadVoices() {
            if (!speechSynth) return;
            voices = speechSynth.getVoices();
            americanVoice = voices.find(v => v.lang === 'en-US' && v.name.includes('Google')) ||
                           voices.find(v => v.lang === 'en-US') ||
                           voices.find(v => v.lang === 'en') ||
                           voices[0] || null;
        }

        if (speechSynth) {
            loadVoices();
            speechSynth.onvoiceschanged = loadVoices;
        }

        function speakWord(word, rate = 0.85) {
            if (!speechSynth) return false;
            try {
                speechSynth.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = rate;
                utterance.pitch = 1.1;
                utterance.volume = 1.0;
                if (americanVoice) utterance.voice = americanVoice;
                speechSynth.speak(utterance);
                return true;
            } catch (e) { return false; }
        }

        function speakLetter(letter) {
            if (!speechSynth) return false;
            try {
                speechSynth.cancel();
                const utterance = new SpeechSynthesisUtterance(letter);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                utterance.pitch = 1.2;
                if (americanVoice) utterance.voice = americanVoice;
                speechSynth.speak(utterance);
                return true;
            } catch (e) { return false; }
        }

        // ========== 3. 单词库 ==========
        const wordMap = {
            A: ['APPLE', 'ANT', 'ARM'],
            B: ['BALL', 'BIRD', 'BANANA', 'BEAR'],
            C: ['CAT', 'CAR', 'CHAIR', 'CAKE'],
            D: ['DOG', 'DUCK', 'DESK', 'DOLL'],
            E: ['EGG', 'ELEPHANT', 'EAR'],
            F: ['FISH', 'FLOWER', 'FROG', 'FOX'],
            G: ['GREEN', 'GRAPE', 'GIRL', 'GIRAFFE'],
            H: ['HAT', 'HORSE', 'HAND', 'HOUSE'],
            I: ['ICE', 'INSECT', 'ISLAND', 'ICE CREAM'],
            J: ['JUICE', 'JAM', 'JELLY', 'JEEP'],
            K: ['KITE', 'KEY', 'KANGAROO', 'KID'],
            L: ['LION', 'LEAF', 'LAMP', 'LEMON'],
            M: ['MONKEY', 'MOON', 'MOUSE', 'MILK'],
            N: ['NOSE', 'NEST', 'NURSE', 'NUT'],
            O: ['ORANGE', 'OCEAN', 'ONION', 'OWL'],
            P: ['PIG', 'PEAR', 'PENCIL', 'PANDA'],
            Q: ['QUEEN', 'QUESTION', 'QUILT', 'QUAIL'],
            R: ['RABBIT', 'RICE', 'ROSE', 'RAINBOW'],
            S: ['SUN', 'STAR', 'SHIP', 'SNAKE'],
            T: ['TIGER', 'TREE', 'TABLE', 'TRAIN'],
            U: ['UMBRELLA', 'UP', 'UNCLE', 'UNICORN'],
            V: ['VAN', 'VEGETABLE', 'VASE', 'VIOLIN'],
            W: ['WATER', 'WINDOW', 'WATCH', 'WHALE'],
            X: ['XYLOPHONE', 'X-RAY'],
            Y: ['YELLOW', 'YARD', 'YO-YO', 'YOGURT'],
            Z: ['ZOO', 'ZEBRA', 'ZIPPER', 'ZUCCHINI']
        };

        const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        const TOTAL_LEVELS = 100;
        const PAIRS_PER_LEVEL = 8;

        function generateLevels() {
            const levels = [];
            const allLetters = LETTERS.slice();
            for (let level = 1; level <= TOTAL_LEVELS; level++) {
                const unlockCount = Math.min(8 + Math.floor((level - 1) / 4), 26);
                const availableLetters = allLetters.slice(0, unlockCount);
                const shuffled = [...availableLetters].sort(() => Math.random() - 0.5);
                const selectedLetters = shuffled.slice(0, PAIRS_PER_LEVEL);
                const pairs = selectedLetters.map(letter => {
                    const wordList = wordMap[letter] || [`${letter}WORD`];
                    const word = wordList[Math.floor(Math.random() * wordList.length)];
                    return { letter, word };
                });
                levels.push(pairs);
            }
            return levels;
        }

        const LEVELS = generateLevels();

        // ========== 4. 游戏状态 ==========
        let currentLevel = 1;
        let currentPairs = [];
        let cards = [];
        let selectedCardId = null;
        let matchedCount = 0;
        let moves = 0;
        let gameFinished = false;

        const boardEl = document.getElementById('board');
        const levelDisplay = document.getElementById('levelDisplay');
        const pairsMatchedSpan = document.getElementById('pairsMatched');
        const movesSpan = document.getElementById('moves');
        const progressFill = document.getElementById('progressFill');
        const messageEl = document.getElementById('message');
        const resetBtn = document.getElementById('resetBtn');
        const nextBtn = document.getElementById('nextBtn');

        // ========== 5. 趣味特效 ==========
        function createStars(x, y, count = 5) {
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star-fall';
                star.textContent = ['⭐', '🌟', '✨', '💫'][Math.floor(Math.random() * 4)];
                star.style.left = (x + (Math.random() - 0.5) * 100) + 'px';
                star.style.top = y + 'px';
                star.style.fontSize = (1.2 + Math.random() * 1) + 'rem';
                star.style.animationDelay = (i * 0.1) + 's';
                document.body.appendChild(star);
                setTimeout(() => star.remove(), 1500);
            }
        }

        function createConfetti(count = 20) {
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#f368e0', '#ff9f43'];
            for (let i = 0; i < count; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = '-10px';
                conf.style.background = colors[Math.floor(Math.random() * colors.length)];
                conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                conf.style.width = (8 + Math.random() * 8) + 'px';
                conf.style.height = (8 + Math.random() * 8) + 'px';
                conf.style.animationDelay = (Math.random() * 0.5) + 's';
                conf.style.animationDuration = (1 + Math.random()) + 's';
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 2500);
            }
        }

        function showAnimalBubble(x, y, animalType = 'dog') {
            const animals = {
                dog: '🐶', cat: '🐱', bird: '🐦', duck: '🦆',
                bear: '🐻', rabbit: '🐰', panda: '🐼', lion: '🦁'
            };
            const emoji = animals[animalType] || '🐶';
            const bubble = document.createElement('div');
            bubble.className = 'animal-bubble';
            bubble.textContent = emoji;
            bubble.style.left = (x - 25) + 'px';
            bubble.style.top = (y - 50) + 'px';
            document.body.appendChild(bubble);
            setTimeout(() => bubble.remove(), 900);
        }

        // ========== 6. 工具函数 ==========
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function buildCardsFromPairs(pairs) {
            const newCards = [];
            pairs.forEach((pair, idx) => {
                newCards.push({
                    id: `l-${currentLevel}-${idx}-${Date.now()}-${Math.random()}`,
                    type: 'letter',
                    content: pair.letter,
                    pairId: idx,
                    eliminated: false
                });
                newCards.push({
                    id: `w-${currentLevel}-${idx}-${Date.now()}-${Math.random()}`,
                    type: 'word',
                    content: pair.word,
                    pairId: idx,
                    eliminated: false
                });
            });
            return shuffleArray(newCards);
        }

        function updateStats() {
            pairsMatchedSpan.textContent = matchedCount;
            movesSpan.textContent = moves;
            const progressPercent = (matchedCount / PAIRS_PER_LEVEL) * 100;
            progressFill.style.width = `${progressPercent}%`;
            levelDisplay.textContent = `第 ${currentLevel} / 100 关`;
        }

        function checkLevelComplete() {
            if (matchedCount === PAIRS_PER_LEVEL) {
                gameFinished = true;
                messageEl.textContent = '🎉 太棒了！本关完成！点击下一关继续~';
                nextBtn.disabled = false;
                playLevelCompleteSound();
                createConfetti(30);
                if (currentLevel === TOTAL_LEVELS) {
                    messageEl.textContent = '🏆 恭喜你！通关所有100关！你太厉害了！';
                    nextBtn.disabled = true;
                    createConfetti(60);
                }
            } else {
                nextBtn.disabled = true;
            }
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            cards.forEach(card => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card';
                cardDiv.dataset.type = card.type;
                if (card.eliminated) cardDiv.classList.add('eliminated');
                if (selectedCardId === card.id && !card.eliminated) cardDiv.classList.add('selected');
                // 字母卡显示字母，单词卡显示单词
                cardDiv.innerHTML = `<span>${card.content}</span>`;
                cardDiv.dataset.id = card.id;
                cardDiv.addEventListener('click', (e) => {
                    if (card.type === 'word' && !card.eliminated) {
                        const spoken = speakWord(card.content);
                        if (!spoken) {
                            playTone(600, 0.15, 'sine', 0.15);
                            setTimeout(() => playTone(800, 0.15, 'sine', 0.15), 150);
                        }
                    } else if (card.type === 'letter' && !card.eliminated) {
                        speakLetter(card.content);
                    }
                    handleCardClick(card.id, e);
                });
                boardEl.appendChild(cardDiv);
            });
        }

        function handleCardClick(cardId, event) {
            if (gameFinished) return;
            initAudio();

            const card = cards.find(c => c.id === cardId);
            if (!card || card.eliminated) return;

            if (selectedCardId === null) {
                selectedCardId = cardId;
                playSelectSound();
                renderBoard();
                return;
            }

            const firstCard = cards.find(c => c.id === selectedCardId);
            if (!firstCard || firstCard.eliminated) {
                selectedCardId = cardId;
                playSelectSound();
                renderBoard();
                return;
            }

            if (selectedCardId === cardId) {
                selectedCardId = null;
                playSelectSound();
                renderBoard();
                return;
            }

            moves++;
            movesSpan.textContent = moves;

            const isLetterAndWord = (firstCard.type === 'letter' && card.type === 'word') ||
                                    (firstCard.type === 'word' && card.type === 'letter');
            let isMatch = false;

            if (isLetterAndWord) {
                const letterCard = firstCard.type === 'letter' ? firstCard : card;
                const wordCard = firstCard.type === 'word' ? firstCard : card;
                if (wordCard.content[0] === letterCard.content) {
                    isMatch = true;
                }
            }

            const rect = event ? event.target.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2 };
            const clickX = rect.left + rect.width / 2;
            const clickY = rect.top + rect.height / 2;

            if (isMatch) {
                firstCard.eliminated = true;
                card.eliminated = true;
                matchedCount++;
                selectedCardId = null;
                updateStats();
                renderBoard();
                playMatchSound();
                createStars(clickX, clickY, 6);
                const animals = ['dog', 'cat', 'bird', 'duck'];
                const randomAnimal = animals[Math.floor(Math.random() * animals.length)];
                setTimeout(() => playAnimalSound(randomAnimal), 200);
                showAnimalBubble(clickX, clickY, randomAnimal);
                const wordCard = firstCard.type === 'word' ? firstCard : card;
                setTimeout(() => speakWord(wordCard.content, 0.8), 250);
                messageEl.textContent = `✔️ 正确！${firstCard.type === 'letter' ? firstCard.content : card.content} 配对成功！`;
                checkLevelComplete();
            } else {
                selectedCardId = null;
                renderBoard();
                playErrorSound();
                messageEl.textContent = `❌ 不对应，再试试看！`;
                movesSpan.textContent = moves;
                setTimeout(() => {
                    if (!gameFinished && messageEl.textContent.includes('不对应')) {
                        messageEl.textContent = '👆 点一点字母和单词，消掉它们吧！';
                    }
                }, 800);
            }
        }

        function loadLevel(level) {
            if (level < 1 || level > TOTAL_LEVELS) return;
            if (speechSynth) speechSynth.cancel();

            currentLevel = level;
            const pairs = LEVELS[level - 1] || LEVELS[0];
            currentPairs = pairs.map(p => ({ ...p }));

            cards = buildCardsFromPairs(currentPairs);
            selectedCardId = null;
            matchedCount = 0;
            moves = 0;
            gameFinished = false;
            nextBtn.disabled = true;
            messageEl.textContent = `第 ${currentLevel} 关：点一点字母和单词，消掉它们吧！`;

            updateStats();
            renderBoard();
        }

        function resetLevel() {
            playSelectSound();
            if (speechSynth) speechSynth.cancel();
            loadLevel(currentLevel);
        }

        function nextLevel() {
            if (currentLevel < TOTAL_LEVELS) {
                playNextLevelSound();
                if (speechSynth) speechSynth.cancel();
                loadLevel(currentLevel + 1);
            } else {
                messageEl.textContent = '🎯 已是最后一关，你已全部通关！';
            }
        }

        // ========== 7. 初始化 ==========
        function init() {
            resetBtn.addEventListener('click', resetLevel);
            nextBtn.addEventListener('click', nextLevel);

            document.body.addEventListener('click', function initAudioOnce() {
                initAudio();
                if (speechSynth && voices.length === 0) {
                    loadVoices();
                }
                document.body.removeEventListener('click', initAudioOnce);
            }, { once: true });

            if (speechSynth) {
                loadVoices();
                speechSynth.onvoiceschanged = loadVoices;
            }

            loadLevel(1);
        }

        window.addEventListener('DOMContentLoaded', init);
    })();
</script>
</body>
</html>
